<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lee Betting - Spelare</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070a0f;--panel:#0f141d;--panel2:#131a26;
    --border:#1e2836;--border-soft:#18202c;
    --text:#e9eef7;--muted:#8b97a8;
    --gold:#e8c15a;--gold-deep:#c9962f;
    --green:#33e08a;--red:#e05a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  #loginScreen, #resetScreen, #forgotModal {position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
  #resetScreen, #forgotModal {display:none;}
  
  .login-card{width:100%;max-width:320px;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:12px;}
  .login-card h1{font-size:16px;letter-spacing:2px;text-align:center;margin-bottom:4px;}
  .login-card p{font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;margin-bottom:20px;}
  .login-card input{width:100%;padding:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;outline:none;margin-bottom:10px;}
  .login-card button{width:100%;margin-top:6px;padding:10px;border:none;border-radius:6px;background:linear-gradient(135deg,#f6da8b,var(--gold-deep));color:#1a1206;font-weight:800;font-size:13px;cursor:pointer;}

  .topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;}
  .logo-mark{width: 40px; height: 24px;display:flex;align-items:center;justify-content:center;overflow: hidden; border-radius: 2px;}
  .logo-mark svg { width: 100%; height: 100%; object-fit: cover; }
  .brand-name{font-weight:800;font-size:13px;letter-spacing:1.5px}
  .brand-sub{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .spacer{flex:1}
  
  .top-controls { display: flex; align-items: center; gap: 12px; }
  .countdown { font-size: 15px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  .countdown.warning { color: var(--red); }
  .btn-logout { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 4px 10px; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .btn-logout:hover { color: var(--text); border-color: rgba(232,193,90,0.35); }

  .main{flex:1;padding:16px;display:grid;grid-template-columns: 1fr 340px;gap: 16px;height: calc(100vh - 60px);overflow: hidden;}
  .left-column{display:flex;flex-direction:column;overflow:hidden;height:100%;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;flex:1;overflow:hidden;}
  .panel-head{padding:10px 16px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;}
  .panel-head h2{font-size:14px;font-weight:700;}
  
  .btn-clear { background: transparent; border: 1px solid rgba(224, 90, 90, 0.4); color: var(--red); padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-clear:hover { background: rgba(224, 90, 90, 0.1); border-color: var(--red); }

  .match-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      grid-auto-rows: 1fr;
      gap: 8px;
      padding: 10px;
      overflow-y: auto;
      flex: 1;
      align-content: stretch;
  }
  .match {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      gap: 6px;
      transition: 0.2s;
  }
  .match.locked{opacity:0.5;pointer-events:none;}
  .match-header{display:flex;justify-content:space-between;align-items:center;}
  .match-no{font-size:10px;font-weight:800;color:var(--gold);}
  .teams{font-size:12px;font-weight:600;line-height:1.3;}
  .teams span{display:block;}
  .signs{display:flex;gap:4px; margin-top: auto;}
  .sign{flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:4px;color:var(--muted);background:rgba(255,255,255,0.02);border:1px solid var(--border-soft);cursor:pointer;transition:0.15s;}
  .sign:hover{background:rgba(255,255,255,0.05);}
  .sign.on{color:var(--gold);background:rgba(232,193,90,0.15);border-color:rgba(232,193,90,0.4);}
  
  .data-label { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .notes-card { 
      grid-column: span 2; 
      background: var(--panel2); 
      border: 1px dashed var(--border); 
      border-radius: 10px; 
      padding: 10px; 
      display: flex; 
      flex-direction: column; 
  }
  .notes-card textarea { flex: 1; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px; resize: none; outline: none; font-family: inherit; font-size: 12px; }

  .live-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .live-header { display:flex; justify-content:space-between; margin-bottom:12px; border-bottom: 1px solid var(--border-soft); padding-bottom: 8px;}
  .live-header h2 { font-size:16px; }
  .live-header span { font-size:11px; color:var(--gold); font-weight: 600;}
  .live-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(115px, 1fr)); gap:8px; overflow-y: auto; padding-right: 4px; }
  .live-card { background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:8px; }
  .live-card-no { font-size:10px; color:var(--gold); font-weight:800; margin-bottom:4px;}
  .live-card-teams { font-size:11px; font-weight:600; line-height:1.3; margin-bottom:6px;}
  .live-card-pick { font-size:14px; font-weight:800; color:var(--gold); text-align:center; background:rgba(232,193,90,0.1); padding:6px; border-radius:4px; border:1px solid rgba(232,193,90,0.3); }

  .chat-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border-soft); font-size: 14px; font-weight: 700; background: var(--panel2); display: flex; justify-content: space-between; align-items: center; }
  .chat-status { font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .chat-status::before { content: ""; display: block; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
  .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 4px; }
  .msg.lee { align-self: flex-start; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg-sender { font-size: 9px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg.lee .msg-sender { color: var(--gold); }
  .msg-bubble { padding: 10px 14px; border-radius: 10px; font-size: 12px; line-height: 1.4; }
  .msg.lee .msg-bubble { background: rgba(232,193,90,0.1); border: 1px solid rgba(232,193,90,0.3); border-bottom-left-radius: 2px; }
  .msg.me .msg-bubble { background: var(--panel2); border: 1px solid var(--border); border-bottom-right-radius: 2px; }
  .chat-input { padding: 12px; border-top: 1px solid var(--border-soft); background: var(--panel2); display: flex; gap: 8px; }
  .chat-input input { flex: 1; padding: 10px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border); color: var(--text); font-size: 12px; outline: none; }
  .chat-input button { padding: 10px 16px; border-radius: 6px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #1a1206; font-weight: 800; font-size: 12px; cursor: pointer; }

  .submit-bar{padding:10px 16px;border-top:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center;background:var(--panel2);flex-shrink:0;}
  .submit-info{font-size:12px;color:var(--muted);}
  .submit-info strong{color:var(--text);}
  .btn-submit{padding:8px 16px;border:none;border-radius:6px;background:linear-gradient(135deg,#f6da8b,var(--gold-deep));color:#1a1206;font-weight:800;font-size:12px;cursor:pointer;transition:0.2s;}
  .btn-submit:disabled{opacity:0.5;cursor:not-allowed;}

  .custom-toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel); border: 1px solid var(--gold);
      color: var(--text); padding: 12px 24px; border-radius: 8px;
      font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0; transition: all 0.3s; z-index: 99999; pointer-events: none;
  }
  .custom-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 768px) {
    .main { display: flex; flex-direction: column; height: auto; min-height: calc(100vh - 60px); overflow-y: auto; padding: 12px; }
    .left-column { height: auto; overflow: visible; }
    .panel { height: auto; min-height: 450px; margin-bottom: 16px; }
    .chat-panel { height: 500px; flex-shrink: 0; }
    .match-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .topbar { flex-wrap: wrap; gap: 8px; padding: 8px; }
    .top-controls { width: 100%; justify-content: space-between; margin-top: 8px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>LEE BETTING</h1>
    <p>Spelarinloggning</p>
    <input type="email" id="loginUser" placeholder="Din e-postadress">
    <input type="password" id="loginPass" placeholder="Lösenord">
    <button onclick="login()">Logga in</button>
    <div style="text-align:center; margin-top:14px;">
      <a href="#" onclick="showForgotPassword(event)" style="color:var(--muted); font-size:11px; text-decoration:underline;">Glömt lösenord?</a>
    </div>
  </div>
</div>

<!-- Ruta för att skriva nytt lösenord -->
<div id="resetScreen">
  <div class="login-card">
    <h1>NYTT LÖSENORD</h1>
    <p>Välj ett nytt lösenord</p>
    <input type="password" id="newPass" placeholder="Nytt lösenord (minst 6 tecken)">
    <button onclick="saveNewPassword()">Spara lösenord</button>
  </div>
</div>

<!-- Ruta för att begära återställningslänk -->
<div id="forgotModal">
  <div class="login-card">
    <h1>ÅTERSTÄLL</h1>
    <p>Ange din e-postadress</p>
    <input type="email" id="forgotEmail" placeholder="namn@gmail.com">
    <button type="button" onclick="submitForgotPassword()">Skicka länk</button>
    <div style="text-align:center; margin-top:14px;">
      <a href="#" onclick="closeForgotPassword(event)" style="color:var(--muted); font-size:11px; text-decoration:underline;">Avbryt</a>
    </div>
  </div>
</div>

<div id="app" style="display:none; flex-direction:column; height:100vh;">
  <header class="topbar">
    <div class="logo-mark"><img src="logo.png" style="width: 100%; height: 100%; object-fit: contain; border-radius: 4px;"></div>
    <div>
      <div class="brand-name">LEE BETTING</div>
      <div class="brand-sub" id="brandSub">Spelare</div>
    </div>
    <div class="spacer"></div>
    <div class="top-controls">
      <span style="font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-right:8px;">Till inlämning:</span>
      <span class="countdown" id="countdown">--:--:--</span>
      <button class="btn-logout" onclick="logout()">Logga ut</button>
    </div>
  </header>

  <main class="main">
      <div class="left-column">
        <section class="panel" id="tipView">
          <div class="panel-head">
            <h2>Dina tips</h2>
            <button class="btn-clear" onclick="clearMyCoupon()">Rensa</button>
          </div>
          <div class="match-grid" id="matchGrid"></div>
          <div class="submit-bar">
            <div class="submit-info" id="submitInfo">Ifyllda: <strong>0</strong> / 13</div>
            <button class="btn-submit" id="undoBtn" onclick="undoTips()" style="display:none; background:var(--red); color:white; margin-right:8px;">Ångra inlämning</button>
            <button class="btn-submit" id="submitBtn" onclick="submitTips()">Lämna in tips</button>
          </div>
        </section>

        <section class="panel" id="liveView" style="display: none;">
          <div class="live-header" style="padding: 16px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between;">
            <h2 style="font-size:16px;">Livevy - Lees Spel</h2>
            <span id="playerLiveStatusText" style="font-size:11px; color:var(--green); font-weight:600;">ÖPPEN</span>
          </div>
          <div class="live-grid" id="liveGrid" style="padding: 16px; overflow-y: auto;"></div>
        </section>
      </div>

      <div class="chat-panel">
        <div class="chat-header">
          <span>Live Chatt</span>
          <div class="chat-status">Ansluten</div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Skriv ett meddelande..." onkeypress="if(event.key === 'Enter') sendChat()">
          <button onclick="sendChat()">Skicka</button>
        </div>
      </div>
    </main>
</div>

<script>
  window.alert = function(msg) {
      let t = document.getElementById('custom-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'custom-toast';
        t.className = 'custom-toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  };
</script>

<script>
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const SB_CFG = window.SUPABASE_CONFIG || {
    url: "https://yjkyikxtklaokscnpxdj.supabase.co",
    key: "sb_publishable_ev3HUbED2MIMHhy6feLXlw_i81spvXM"
  };
  const supabaseClient = window.supabase.createClient(SB_CFG.url, SB_CFG.key);

  // HÄR HAR VI EN SÄKERHETS-LISTA MED ALLA MATCHER SÅ DET ALDRIG BLIR TOMT
  const FALLBACK_MATCHES = [
    { home: 'Bayern München', away: 'Arsenal' }, { home: 'Aston Villa', away: 'Viking' },
    { home: 'Inter', away: 'Shakhtar Donetsk' }, { home: 'Real Madrid', away: 'RB Leipzig' },
    { home: 'Real Betis', away: 'Feyenoord' }, { home: 'Club Brügge', away: 'Lens' },
    { home: 'Sporting Lissabon', away: 'LASK Linz' }, { home: 'Reading', away: 'Leyton Orient' },
    { home: 'Iberia 1999', away: 'Mjällby' }, { home: 'Juventus', away: 'Rennes' },
    { home: 'Lech Poznan', away: 'Sunderland' }, { home: 'Sturm Graz', away: 'Marseille' },
    { home: 'Crvena Zvezda', away: 'FC Köpenhamn' }
  ];

  let MATCHES = [...FALLBACK_MATCHES];
  let currentPlayer = '';
  let currentUserId = null;
  let currentRoundId = null;
  let picks = Array(13).fill(null).map(() => []);
  let isSubmitted = false;
  let deadline = 0;
  let timerInterval = null;
  let chatInterval = null;

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('resetScreen').style.display = 'flex';
    }
  });

  async function login() {
    const email = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!email || !password) { alert('Fyll i både e-post och lösenord.'); return; }
    
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { 
      let msg = error.message;
      if (msg.includes('Invalid login credentials')) msg = 'Fel e-post eller lösenord.';
      else msg = 'Ett fel uppstod: ' + msg;
      alert(msg); return; 
    }
    
    const { data: profile } = await supabaseClient.from('profiles').select('display_name, username').eq('id', data.user.id).maybeSingle();
    currentPlayer = profile ? (profile.display_name || profile.username) : email.split('@')[0];
    currentUserId = data.user.id;

    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('brandSub').textContent = currentPlayer;
    
    await loadState();
    checkLiveStatus();
    startCountdown();
    
    if (chatInterval) clearInterval(chatInterval);
    chatInterval = setInterval(() => { if (!document.hidden) renderChat(); }, 3000);
  }

  async function saveNewPassword() {
    const newPass = document.getElementById('newPass').value;
    if (newPass.length < 6) { alert('Lösenordet måste vara minst 6 tecken.'); return; }
    
    const { error } = await supabaseClient.auth.updateUser({ password: newPass });
    
    if (error) {
      alert('Kunde inte spara: ' + error.message);
    } else {
      alert('Lösenordet har uppdaterats! Du kan nu logga in.');
      await supabaseClient.auth.signOut();
      location.reload();
    }
  }

  async function logout() {
    clearInterval(timerInterval);
    clearInterval(chatInterval);
    await supabaseClient.auth.signOut();
    location.reload();
  }

  function showForgotPassword(e) {
    e.preventDefault();
    document.getElementById('forgotEmail').value = '';
    document.getElementById('forgotModal').style.display = 'flex';
  }

  function closeForgotPassword(e) {
    if (e) e.preventDefault();
    document.getElementById('forgotModal').style.display = 'none';
  }

  async function submitForgotPassword() {
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) { alert('Ange din e-postadress.'); return; }
    
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + window.location.pathname
    });
    
    if (error) {
      alert('Fel: ' + error.message);
    } else {
      alert('En återställningslänk har skickats till ' + email + '!');
      closeForgotPassword();
    }
  }

  function checkLiveStatus() {
    if (localStorage.getItem('lee_live_started') === 'true') {
      document.getElementById('tipView').style.display = 'none';
      document.getElementById('liveView').style.display = 'flex';
      renderLiveView(); updatePlayerLiveStatusText();
      renderChat();
    } else {
      document.getElementById('tipView').style.display = 'flex';
      document.getElementById('liveView').style.display = 'none';
      renderMatches();
    }
  }

  window.addEventListener('storage', (e) => { if (e.key === 'lee_live_started') checkLiveStatus(); });

  async function saveState() {
    if (!currentUserId || !currentRoundId) return;
    const { error } = await supabaseClient.from('suggestions').upsert({
      player_id: currentUserId, round_id: currentRoundId, picks: picks, submitted: isSubmitted
    }, { onConflict: 'player_id, round_id' });
    if (error) console.error('Kunde inte spara tips:', error);
    updateSubmitInfo();
  }

  async function loadState() {
    try {
      const { data: rounds } = await supabaseClient.from('rounds').select('id, deadline').order('created_at', { ascending: false }).limit(1);
      if (rounds && rounds.length > 0) {
        currentRoundId = rounds[0].id;
        if (rounds[0].deadline) deadline = new Date(rounds[0].deadline).getTime();
        
        const { data: matches } = await supabaseClient.from('matches').select('*').eq('round_id', currentRoundId).order('match_order');
        // Om databasen har matcher, använd dem istället för fallback
        if (matches && matches.length === 13) {
          MATCHES = matches.map(m => ({ home: m.home, away: m.away }));
        }

        const { data: suggestion } = await supabaseClient.from('suggestions').select('*').eq('player_id', currentUserId).eq('round_id', currentRoundId).maybeSingle();
        if (suggestion) {
          picks = suggestion.picks || Array(13).fill(null).map(() => []);
          isSubmitted = suggestion.submitted || false;
        }
      }
    } catch (e) { console.error(e); }
  }

  function updatePlayerLiveStatusText() {
      const el = document.getElementById('playerLiveStatusText');
      if (!el) return;
      const isLiveStarted = localStorage.getItem('lee_live_started') === 'true';
      const isDeadlinePassed = deadline > 0 && deadline < Date.now();

      if (isLiveStarted) { el.textContent = 'LÅST'; el.style.color = 'var(--red)'; }
      else if (isDeadlinePassed || isSubmitted) { el.textContent = 'LÅST'; el.style.color = 'var(--red)'; }
      else { el.textContent = 'ÖPPEN'; el.style.color = 'var(--green)'; }
  }

  function startCountdown() {
    if (timerInterval) clearInterval(timerInterval);
    const cd = document.getElementById('countdown');
    function update() {
      const ms = deadline - Date.now();
      if (!deadline) { cd.textContent = '--:--:--'; updatePlayerLiveStatusText(); return; }
      if (isSubmitted || ms <= 0) {
        cd.textContent = 'LÅST'; cd.classList.add('warning');
        if (ms <= 0 && !isSubmitted) { isSubmitted = true; renderMatches(); saveState(); }
        updatePlayerLiveStatusText();
        return;
      }
      if (ms < 4 * 60 * 60 * 1000) cd.classList.add('warning'); else cd.classList.remove('warning');
      const totalSecs = Math.floor(ms / 1000);
      const days = Math.floor(totalSecs / (3600 * 24));
      const hours = Math.floor((totalSecs % (3600 * 24)) / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      let timeStr = ''; if (days > 0) timeStr += days + ' dagar ';
      timeStr += String(hours).padStart(2,'0') + ':' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0');
      cd.textContent = timeStr;
      updatePlayerLiveStatusText();
    }
    update(); timerInterval = setInterval(update, 1000);
  }

  function renderMatches() {
    const grid = document.getElementById('matchGrid');
    grid.innerHTML = '';
    MATCHES.forEach((m, i) => {
      const el = document.createElement('div');
      el.className = 'match'; if (isSubmitted) el.classList.add('locked');
      const p = picks[i] || [];
      el.innerHTML = `
        <div class="match-header"><span class="match-no">M${i+1}</span></div>
        <div class="teams"><span>${esc(m.home)}</span><span>${esc(m.away)}</span></div>
        <div class="signs">
          <div class="sign ${p.includes('1') ? 'on' : ''}" onclick="toggleSign(${i}, '1')">1</div>
          <div class="sign ${p.includes('X') ? 'on' : ''}" onclick="toggleSign(${i}, 'X')">X</div>
          <div class="sign ${p.includes('2') ? 'on' : ''}" onclick="toggleSign(${i}, '2')">2</div>
        </div>`;
      grid.appendChild(el);
    });
    
    const noteCard = document.createElement('div');
    noteCard.className = 'notes-card';
    noteCard.innerHTML = `
      <div class="data-label" style="margin-bottom: 6px;">Egna noteringar</div>
      <textarea id="notesArea" placeholder="Skriv dina egna noteringar här...">${esc(localStorage.getItem('lee_player_notes') || '')}</textarea>
    `;
    grid.appendChild(noteCard);

    document.getElementById('notesArea').addEventListener('input', (e) => {
      localStorage.setItem('lee_player_notes', e.target.value);
    });

    updateSubmitInfo();
  }

  function toggleSign(idx, sign) {
    if (isSubmitted) return;
    let currentPicks = picks[idx] || [];
    if (currentPicks.includes(sign)) { if (currentPicks.length > 1) currentPicks = currentPicks.filter(s => s !== sign); }
    else { currentPicks.push(sign); currentPicks.sort((a,b) => ['1','X','2'].indexOf(a) - ['1','X','2'].indexOf(b)); }
    picks[idx] = currentPicks; renderMatches(); saveState();
  }

  function updateSubmitInfo() {
    const filled = picks.filter(p => p && p.length > 0).length;
    const info = document.getElementById('submitInfo');
    const submitBtn = document.getElementById('submitBtn');
    const undoBtn = document.getElementById('undoBtn');
    if (isSubmitted) {
      info.innerHTML = '<strong style="color:var(--green)">Inlämnat!</strong>';
      submitBtn.style.display = 'none'; undoBtn.style.display = 'block';
    } else {
      info.innerHTML = `Ifyllda: <strong>${filled}</strong> / 13`;
      submitBtn.style.display = 'block'; undoBtn.style.display = 'none';
      submitBtn.disabled = filled === 0 || (deadline > 0 && Date.now() > deadline);
    }
  }

  function submitTips() { isSubmitted = true; renderMatches(); saveState(); }
  function undoTips() { if (deadline > 0 && Date.now() > deadline) return; isSubmitted = false; saveState(); renderMatches(); }
  
  function clearMyCoupon() {
    picks = Array(13).fill(null).map(() => []);
    isSubmitted = false;
    renderMatches();
    saveState();
  }

  function renderLiveView() {
    const leePicks = JSON.parse(localStorage.getItem('lee_admin_final') || '[]');
    const grid = document.getElementById('liveGrid'); grid.innerHTML = '';
    MATCHES.forEach((m, i) => {
      const leePick = leePicks[i] ? leePicks[i].join(' ') : 'Väntar...';
      const el = document.createElement('div'); el.className = 'live-card';
      el.innerHTML = `<div class="live-card-no">M${i+1}</div><div class="live-card-teams">${esc(m.home)}<br>${esc(m.away)}</div><div class="live-card-pick">${leePick}</div>`;
      grid.appendChild(el);
    });
  }

  async function renderChat() {
    const { data: chat } = await supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: true }).limit(50);
    if(!chat) return;
    const container = document.getElementById('chatMessages'); if(!container) return;
    const sig = JSON.stringify(chat.map(m => m.id ?? m.created_at));
    if (container.dataset.sig === sig) return;
    container.dataset.sig = sig;
    const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
    container.innerHTML = chat.map(m => {
      const isMe = m.username === currentPlayer;
      return `<div class="msg ${isMe ? 'me' : 'lee'}"><span class="msg-sender">${isMe ? 'Du' : esc(m.username)}</span><div class="msg-bubble">${esc(m.message)}</div></div>`;
    }).join('');
    if (isScrolledToBottom) container.scrollTop = container.scrollHeight;
  }

  async function sendChat() {
    const input = document.getElementById('chatInput'); const text = input.value.trim();
    if (!text) return;
    await supabaseClient.from('chat_messages').insert({ username: currentPlayer, message: text });
    input.value = ''; renderChat();
  }
</script>
</body>
</html>
